version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: "/infra/services/ocr"
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: "/infra/services/voice_id"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/infra"
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: "/infra"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/infra/services/ocr"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/infra/services/long_ocr"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/infra/services/voice_id"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
