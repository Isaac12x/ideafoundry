services:
  web:
    build: .
    ports:
      - "${PORT:-3333}:3000"
    environment:
      - RAILS_ENV=production
      - PORT=3000
      - OCR_SERVICE_URL=http://ocr:8000/extract
    volumes:
      - ./storage:/rails/storage
      - ./config/master.key:/rails/config/master.key:ro
    depends_on:
      ocr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  ocr:
    build: ./ocr_service
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped
