# Recurring jobs for Solid Queue.
# These run automatically in production via Solid Queue's recurring scheduler.
#
# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour

production:
  # Queue maintenance
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Submission management
  expire_stale_submissions:
    class: ExpireSubmissionsJob
    queue: default
    schedule: at 3am every day

  # Email digests
  daily_digest:
    class: IdeaDigestJob
    queue: default
    args: ["daily"]
    schedule: at 7am every day

  weekly_digest:
    class: IdeaDigestJob
    queue: default
    args: ["weekly"]
    schedule: "0 8 * * 1"

  # Automated backups
  scheduled_backup:
    class: ScheduledBackupJob
    queue: default
    schedule: at 2am every day

  # Cool-off transitions check (catches any missed expirations)
  process_expired_cool_offs:
    command: "Idea.cool_off_expired.find_each { |idea| CoolOffTransitionJob.perform_later(idea) }"
    schedule: every hour at minute 0

  # Orphaned draft cleanup (auto-drafts abandoned during idea creation)
  clean_orphaned_drafts:
    class: CleanOrphanedDraftsJob
    queue: default
    schedule: at 4am every day

  # App self-upgrade check
  check_app_upgrade:
    class: CheckAppUpgradeJob
    queue: default
    schedule: every hour at minute 30

  # Stop the on-demand heavy OCR backend once it has been idle (no active
  # extractions for OCR_LONG_IDLE_TIMEOUT seconds).
  long_ocr_idle_stop:
    class: LongOcrIdleStopJob
    queue: default
    schedule: every 2 minutes
